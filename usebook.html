<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nL程序设计入门</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            height: 100vh;
            font-family: "SimSun", "Microsoft YaHei", serif;
            background-color: #f8f5eb;
            overflow: hidden;
        }

        /* 侧边目录栏 */
        .sidebar {
            width: 280px;
            background-color: #3c4049;
            color: #f0efe9;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar h2 {
            padding: 20px 16px;
            font-size: 19px;
            border-bottom: 1px solid #555961;
        }

        .chap-item {
            padding: 13px 18px;
            cursor: pointer;
            border-bottom: 1px solid #484c54;
            transition: 0.2s;
        }

        .chap-item:hover {
            background-color: #4f545c;
        }

        .chap-item.active {
            background-color: #e6b450;
            color: #1a1a1a;
            font-weight: bold;
        }

        /* 书本主内容区 */
        .main {
            flex: 1;
            overflow-y: auto;
            padding: 32px 48px;
            background-color: #fffbf2;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
        }

        h1.chap-title {
            font-size: 26px;
            margin-bottom: 22px;
            color: #2b2b2b;
            border-bottom: 2px solid #d6c29c;
            padding-bottom: 10px;
        }

        .text-content {
            font-size: 16px;
            line-height: 1.85;
            color: #2c2c2c;
            margin-bottom: 18px;
        }

        .text-content strong {
            color: #b04040;
        }

        pre.code-block {
            background-color: #272e3b;
            color: #e6e6e6;
            padding: 16px 20px;
            border-radius: 4px;
            font-family: Consolas, monospace;
            font-size: 14px;
            overflow-x: auto;
            margin: 16px 0 24px 0;
        }

        code {
            background: #ede8da;
            padding: 1px 4px;
            border-radius: 2px;
            color: #a82828;
        }

        /* 习题板块 */
        .exercise-box {
            margin-top: 36px;
            border: 1px solid #d4c4a4;
            background: #f7f1e0;
            padding: 20px 22px;
            border-radius: 6px;
        }

        .exercise-box h3 {
            font-size: 18px;
            margin-bottom: 14px;
            color: #703800;
        }

        .exercise-item {
            margin-bottom: 12px;
            line-height: 1.7;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <h2>📖 nL程序设计入门</h2>
        <div class="chap-item" data-id="var">第1章 变量与常量</div>
        <div class="chap-item" data-id="basic-type">第2章 基础数据类型</div>
        <div class="chap-item" data-id="array">第3章 数组</div>
        <div class="chap-item" data-id="if">第4章 分支if‑elif‑else</div>
        <div class="chap-item" data-id="for">第5章 for循环与jump跳出</div>
        <div class="chap-item" data-id="function">第6章 函数定义与调用</div>
        <div class="chap-item" data-id="class">第7章 类与泛型模板</div>
        <div class="chap-item" data-id="unary">第8章 一元运算符 !、‑</div>
        <div class="chap-item" data-id="cast">第9章 强制类型转换</div>
        <div class="chap-item" data-id="stdlib">第10章 标准库简介</div>
        <div class="chap-item" data-id="vec">第11章 vector动态数组</div>
        <div class="chap-item" data-id="stk">第12章 stack栈容器</div>
    </div>

    <div class="main">
        <div class="container" id="mainContent"></div>
    </div>

    <script>
        const bookChapters = {
            var: {
                title: "第1章 变量与常量",
                text: `
<p>程序运行时需要保存数据，就需要使用<span style="color:#b04040"><strong>变量</strong></span>。
nL使用关键字 <code>var</code> 声明变量。</p>
<p>语法格式：<code>var 类型 变量名 = 初始值;</code></p>
<ul>
<li><code>var</code>：变量声明关键字</li>
<li>类型：<code>int float bool string</code>等；使用<code>auto</code>可以自动推导类型</li>
<li><code>const</code>：修饰只读常量，不可重新赋值。</li>
<li><code>ref</code> 引用，类似别名。</li>
</ul>
<p>变量命名只能由字母、数字、下划线组成，不能以数字开头，不能使用关键字。</p>
`,
                code: `// 显式指定类型
var int a = 10;
var bool flag = true;

// auto自动推导类型
var auto b = 3.14;

// const只读变量，不能修改
const var int c = 99;

// ref引用
var int x = 100;
ref var int rx = x;
rx = 200; // 修改rx等价修改x
`,
                exercise: `
<div class="exercise-item">1.填空：声明一个int常量COUNT，值为100：<code>const var int COUNT = ___;</code></div>
<div class="exercise-item">2.读程序写结果：<br>
var int m = 10;<br>
ref var int rm = m;<br>
rm = 88;<br>
print(m);<br>
写出输出结果。
</div>
<div class="exercise-item">3.编程题：定义auto变量，初始值为true，打印该变量。</div>
`
            },
            "basic-type": {
                title: "第2章 基础数据类型",
                text: `
<p>nL内置基础类型：
<ul>
<li><b>int</b>：整数</li>
<li><b>float</b>：浮点数</li>
<li><b>bool</b>：布尔 true / false</li>
<li><b>char</b>：单个字符</li>
<li><b>string</b>字符串</li>
<li><b>vd</b>特殊空值</li>
</ul>
`,
                code: `var int i = 100;
var float f = -2.5;
var bool ok = false;
var char ch = 'A';
var string s = "hello nL";
`,
                exercise: `
<div class="exercise-item">1.填空：存储小数应该使用____类型；存储真假使用____类型。</div>
<div class="exercise-item">2.读程序写结果：<br>
var float v = 9.99;<br>
var auto k = int&lt;v&gt;;<br>
print(k);
</div>
<div class="exercise-item">3.编程题：定义char变量保存字符'X'，定义string保存"学习nL"，依次打印。</div>
`
            },
            array: {
                title: "第3章 数组 array",
                text: `
<p><strong>array数组</strong>用于存放一组相同类型的数据。<br>
一维数组语法：<code>array 类型 名字[长度] = {初始列表};</code></p>
<p>数组下标<strong>从0开始</strong>，支持多维数组；<code>alloc</code>用于动态分配数组内存。</p>
`,
                code: `//一维数组
array int arr[5] = {10,20,30,40,50};

//多维数组
array int mat[2][3] = {
    {1,2,3},
    {4,5,6}
};

//alloc动态分配
alloc numbers << int[10];

//数组访问
print(arr[0]);
mat[1][0] = 99;
`,
                exercise: `
<div class="exercise-item">1.填空：array int a[5];数组a一共有___个元素，第一个元素下标是___。</div>
<div class="exercise-item">2.读程序写结果：<br>
array int arr[3]={5,6,7};<br>
print(arr[2]);
</div>
<div class="exercise-item">3.编程题：定义int数组包含{11,22,33}，修改第二个元素为99，打印全部元素。</div>
`
            },
            if: {
                title: "第4章 if / elif / else 条件判断",
                text: `
<p>条件支持bool或者int类型；非0代表true；0代表false。<br>
如果语句只有一行代码，可以省略大括号。</p>
`,
                code: `var int score = 75;

if(score >= 90){
    print("优秀");
} elif(score >=60){
    print("及格");
}else{
    print("不及格");
}

var int flag = 1;
if(flag)
    print("flag不为0");
`,
                exercise: `
<div class="exercise-item">1.填空：if(0) 里面的代码会执行吗？____</div>
<div class="exercise-item">2.读程序写结果：<br>
var int a = 40;<br>
if(a>50){ print("A"); }<br>
elif(a>30){ print("B"); }<br>
else { print("C"); }
</div>
<div class="exercise-item">3.编程题：输入一个数字，如果大于0打印正数，否则打印非正数。</div>
`
            },
            for: {
                title: "第5章 for循环 + jump跳出",
                text: `
<p>for(初始化;条件;增量){ }，三个部分都可以留空；<br>
<code>jump;</code> 跳出最内层for循环，等价C语言break。</p>
`,
                code: `//标准for
for(var int i=0; i<10; i=i+1){
    if(i ==5){
        jump; //直接终止循环
    }
    print(i);
}

// 空条件写法
var int a = 10;
for(;a>0;){
    a = a -1;
}
`,
                exercise: `
<div class="exercise-item">1.填空：<code>jump;</code>的作用是________。</div>
<div class="exercise-item">2.读程序写结果：<br>
for(var int i=1;i<=3;i=i+1){<br>
&nbsp;&nbsp;if(i==2) jump;<br>
&nbsp;&nbsp;print(i);<br>
}
</div>
<div class="exercise-item">3.编程题：使用for循环输出1到10全部数字。</div>
`
            },
            function: {
                title: "第6章 function 函数",
                text: `
<p>定义函数：function 名字(参数列表) -> 返回类型 { }；<br>
参数可以带ref引用；return返回值；auto推导返回类型。void代表无返回值。</p>
`,
                code: `/// @param x 输入整数
/// @return x平方
function square(int x) -> int{
    return x * x;
}

// ref参数
function swap(ref int a, ref int b) -> void{
    var int tmp = a;
    a = b;
    b = tmp;
}

var int res = square(7);
print(res);
`,
                exercise: `
<div class="exercise-item">1.填空：函数没有返回值，返回类型写____。</div>
<div class="exercise-item">2.读程序写结果：<br>
function f(int a)->int{ return a*2; }<br>
var int v = f(6); print(v);
</div>
<div class="exercise-item">3.编程题：写函数add，接收两个int，返回两数之和。</div>
`
            },
            class: {
                title: "第7章 类与模板泛型",
                text: `
<p>class定义类，支持模板泛型 <code>&lt;type T&gt;</code>；支持public/private/protected访问控制；<code>this</code>代表当前对象。</p>
`,
                code: `class Box&lt;type T&gt;{
private:
    var T data;
public:
    Box(T v){
        this.data = v;
    }
    function get() -> T{
        return this.data;
    }
}

//实例化模板类
var Box&lt;int&gt; obj(123);
print(obj.get());
`,
                exercise: `
<div class="exercise-item">1.填空：<code>private</code>修饰的成员，____（允许/不允许）外部直接访问。</div>
<div class="exercise-item">2.读程序：class Box&lt;type T&gt;，这里T是____参数。</div>
<div class="exercise-item">3.编程题：定义类Point保存x,y两个int，提供获取x的成员函数。</div>
`
            },
            unary: {
                title: "第8章 一元运算符 !、‑",
                text: `
<p><code>!expr</code>逻辑取反；<code>-expr</code>一元负号；优先级最高，右结合，支持嵌套。</p>
`,
                code: `var bool ok = true;
var bool notOk = !ok;

var int v = -10;
var int w = -(1+2);

var bool doubleNot = !!true;
print(notOk);
print(v);
print(w);
`,
                exercise: `
<div class="exercise-item">1.填空：!false 的结果是____。</div>
<div class="exercise-item">2.读程序写结果：<br>
var int x = 7;<br>
var int y = -x;<br>
print(y);
</div>
<div class="exercise-item">3.编程题：写出表达式，计算 -(3‑8)，打印结果。</div>
`
            },
            cast: {
                title: "第9章 强制类型转换",
                text: `
<p>nL使用特殊语法 <code>目标类型&lt;表达式&gt;</code> 完成强制类型转换。</p>
<ul>
<li><code>int&lt;val&gt;</code>：转为整数，小数直接截断，舍弃小数部分。</li>
<li><code>float&lt;val&gt;</code>：转为浮点数。</li>
<li><code>bool&lt;val&gt;</code>：int非0得到true，0得到false。</li>
</ul>
<p>注意：强制转换有可能丢失精度。只能在基础类型之间转换，不能直接转换类对象。</p>
`,
                code: `var float pi = 3.999;
// float转int，小数直接截断
var auto a = int&lt;pi&gt;;
print(a);

// int转float
var int num = 10;
var auto b = float&lt;num&gt;;
print(b);

// int转bool
var auto flag1 = bool&lt;100&gt;;
var auto flag2 = bool&lt;0&gt;;
print(flag1);
print(flag2);
`,
                exercise: `
<div class="exercise-item">1.填空：<code>int&lt;5.99&gt;</code>结果为____。</div>
<div class="exercise-item">2.读程序写结果：<br>
var float f = -2.8;<br>
var auto k = int&lt;f&gt;;<br>
print(k);
</div>
<div class="exercise-item">3.填写代码中的________。</div>
<div class="exercise-item">4.编程题：定义float变量7.25，强制转换成int并打印。</div>
`
            },
            stdlib: {
                title: "第10章 标准库简介",
                text: `
<p>nL标准库由一系列使用nL编写的模板类组成，需要使用 <code>include</code>引入头文件才能使用。</p>
<ul>
<li><code>stack</code>：栈，后进先出容器。</li>
<li><code>vector</code>：动态数组，长度可以自动增长。</li>
</ul>
<p>引入语法：<code>include "stack.nl"</code>。引入之后就可以定义对象，例如 <code>var vector&lt;int&gt; v;</code>。</p>
<p>标准库基于class泛型实现，内部使用alloc动态内存，使用容器尽量遵循库文档说明，避免越界访问产生未定义行为UB。</p>
`,
                code: `//引入vector库
include &lt;vector.nl&gt;;

var vector&lt;int&gt; vec;
vec.push(10);
vec.push(20);

print(vec.back());
print(vec.len());
`,
                exercise: `
<div class="exercise-item">1.填空：引入stack库使用语句________。</div>
<div class="exercise-item">2.判断：vector属于模板类，需要指定存储元素类型（对/错）。</div>
<div class="exercise-item">3.编程题：写出引入stack库并定义int类型栈对象的代码。</div>
`
            },
            vec: {
                title: "第11章 vector动态数组容器",
                text: `
<p><code>vector&lt;type T&gt;</code>动态数组，内存自动扩容，不需要手动指定长度。</p>
<ul>
<li><code>push(x)</code>：尾部追加元素</li>
<li><code>pop()</code>：删除末尾元素</li>
<li><code>back()</code>获取末尾元素，<code>front()</code>获取头部元素</li>
<li><code>len()</code>返回当前元素个数</li>
<li><code>empty()</code>判断是否为空</li>
<li><code>clear()</code>清空容器</li>
<li><code>operator[]</code>支持下标访问</li>
</ul>
<p>注意：不要访问超过len()的下标，会产生未定义行为。</p>
`,
                code: `include &lt;vector.nl&gt;

var vector&lt;int&gt; v;

v.push(11);
v.push(22);
v.push(33);

print(v.len());
print(v.front());
print(v.back());

print(v[1]);

v.pop();
print(v.back());
`,
                exercise: `
<div class="exercise-item">1.填空：vector添加尾部元素函数是____；获取元素个数____。</div>
<div class="exercise-item">2.读程序写结果：<br>
var vector&lt;int&gt; vec;<br>
vec.push(10);<br>
vec.push(20);<br>
vec.pop();<br>
print(vec.len());
</div>
<div class="exercise-item">3.编程题：vector存入5,6,7，循环打印全部元素。</div>
`
            },
            stk: {
                title: "第12章 stack栈容器",
                text: `
<p><code>stack&lt;type T&gt;</code>栈容器，遵循<strong>后进先出(LIFO)</strong>规则。</p>
<ul>
<li><code>push(x)</code>：压入栈顶</li>
<li><code>pop()</code>：弹出栈顶（不返回值）</li>
<li><code>top()</code>：获取栈顶元素</li>
<li><code>len()</code>：元素数量</li>
<li><code>empty()</code>：判断栈是否为空</li>
</ul>
<p>注意：空栈调用top()、pop()会产生未定义行为，使用前最好用empty()判断。</p>
`,
                code: `include "stack.nl"

var stack&lt;int&gt; st;

st.push(100);
st.push(200);

print(st.top());
print(st.len());

st.pop();
print(st.top());
`,
                exercise: `
<div class="exercise-item">1.填空：栈遵循____（后进先出/先进先出）；压栈函数____。</div>
<div class="exercise-item">2.读程序写结果：<br>
var stack&lt;int&gt; s;<br>
s.push(1);<br>
s.push(2);<br>
s.pop();<br>
print(s.top());
</div>
<div class="exercise-item">3.编程题：stack依次压入10,20,30；循环直到empty，不断top打印再pop。</div>
`
            }
        };

        let currentId = "var";
        const sidebarItems = document.querySelectorAll(".chap-item");
        const contentDom = document.getElementById("mainContent");

        function renderPage(id) {
            const page = bookChapters[id];
            contentDom.innerHTML = `
        <h1 class="chap-title">${page.title}</h1>
        <div class="text-content">${page.text}</div>
<pre class="code-block">${page.code}</pre>
<div class="exercise-box">
    <h3>📝课后习题</h3>
    ${page.exercise}
</div>
`;
        }

        function setActive(id) {
            sidebarItems.forEach(el => {
                if (el.dataset.id === id) {
                    el.classList.add("active");
                } else {
                    el.classList.remove("active");
                }
            })
        }

        sidebarItems.forEach(item => {
            item.addEventListener("click", () => {
                const id = item.dataset.id;
                currentId = id;
                renderPage(id);
                setActive(id);
            })
        })

        renderPage(currentId);
        setActive(currentId);
    </script>
</body>

</html>
